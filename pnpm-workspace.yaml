packages:
  - apps/*
  - packages/*

# One version of each dependency for the whole monorepo.
catalog:
  # App
  next: 16.4.2
  react: 19.3.1
  react-dom: 19.3.1
  next-intl: 4.14.9
  motion: 14.3.0
  lucide-react: 1.58.0
  uqr: 0.1.3
  gifenc: 1.0.3
  # Layout and overlay editor (PHO-4, PHO-6)
  konva: 10.7.0
  react-konva: 19.3.0
  # Streaming ZIP downloads (EVT-4, SHR-5, screen 15)
  client-zip: 2.5.1
  zod: 4.6.7
  '@serwist/turbopack': 9.5.13
  serwist: 9.5.13
  tailwindcss: 4.3.3
  '@tailwindcss/postcss': 4.3.3
  # Data and auth
  better-auth: 1.7.10
  '@better-auth/drizzle-adapter': 1.7.10
  drizzle-orm: 1.0.0-rc.4
  drizzle-kit: 1.0.0-rc.4
  pg: 8.23.1
  '@types/pg': 8.23.1
  '@vercel/functions': 3.10.1
  server-only: 0.0.1
  '@upstash/ratelimit': 2.2.0
  '@upstash/redis': 1.39.0
  '@aws-sdk/client-s3': 3.1152.0
  '@aws-sdk/s3-request-presigner': 3.1152.0
  resend: 6.33.0
  nodemailer: ^10.1.0
  '@types/nodemailer': ^8.0.2
  # Media and offline
  mediabunny: 1.61.5
  '@mediabunny/aac-encoder': 1.61.5
  dexie: 4.4.6
  # Realtime hub (Cloudflare Worker, apps/realtime)
  wrangler: 4.146.0
  '@cloudflare/workers-types': 5.20261003.1
  # Tooling
  typescript: 5.9.3
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@types/node': 22.20.5
  vitest: 5.0.5
  '@vitest/browser': 5.0.5
  '@vitest/browser-playwright': 5.0.5
  playwright: 1.64.1
  happy-dom: 21.0.3
  fake-indexeddb: 6.2.6
  '@playwright/test': 1.64.1
  '@axe-core/playwright': 4.14.0
  eslint: 10.12.0
  '@eslint/js': 10.0.1
  typescript-eslint: 8.71.2
  eslint-plugin-react-hooks: 7.1.1
  '@next/eslint-plugin-next': 16.4.2
  globals: 17.13.0
  prettier: 3.9.10
  turbo: 2.11.8
  esbuild: 0.28.2

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
  - '@parcel/watcher'
  - workerd
patchedDependencies:
  # Chrome writes VP9 vpcC level 0, which WebCodecs rejects; derive it from the picture size.
  mediabunny@1.61.5: patches/mediabunny@1.61.5.patch
