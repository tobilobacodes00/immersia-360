name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # Corepack provides pnpm in the next step; the built-in cache would look for it too early.
          package-manager-cache: false
      - run: corepack enable
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck test --continue

  e2e:
    name: End-to-end (Chrome, WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: immersia
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      # S3-compatible object storage for guest files (R2 in production). S3Mock ignores signatures,
      # so presigned uploads and downloads work as they would against R2.
      s3:
        image: adobe/s3mock:5.2.3
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: immersia-e2e
        ports: ['9090:9090']
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/immersia
      # Throwaway secret for the CI database only.
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_APP_ORIGIN: http://127.0.0.1:3100
      E2E: '1'
      # Per-run secret for the test-only routes (an ephemeral CI server; it only has to be unguessable).
      E2E_TOKEN: ci-e2e-${{ github.run_id }}-${{ github.run_attempt }}-7f3a9c2e5b8d1f40
      S3_ENDPOINT: http://127.0.0.1:9090
      S3_REGION: us-east-1
      S3_BUCKET: immersia-e2e
      S3_ACCESS_KEY_ID: ci-access-key
      S3_SECRET_ACCESS_KEY: ci-secret-key
      S3_FORCE_PATH_STYLE: '1'
      CRON_SECRET: ci-only-cron-secret-0123456789
      # Platform admins for the e2e admin console: one per browser project, so parallel sign-ins
      # never share a mailbox.
      ADMIN_EMAILS: e2e-admin-chrome@example.com,e2e-admin-webkit@example.com
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # Corepack provides pnpm in the next step; the built-in cache would look for it too early.
          package-manager-cache: false
      - run: corepack enable
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Install browsers
        working-directory: apps/web
        # Chrome stable ships on the runner image; WebKit needs Playwright's build and system deps.
        run: pnpm exec playwright install --with-deps webkit
      - name: Migrate database
        run: pnpm --filter @immersia/db db:migrate
      # The build downloads the PHO-9 font files pinned in library.json (apps/web/scripts/fetch-font-library.mjs);
      # cached by content hash, so a changed manifest only fetches what changed.
      - name: Cache font library
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache/font-library
          key: font-library-${{ runner.os }}-${{ hashFiles('packages/fonts/src/library.json') }}
          restore-keys: font-library-${{ runner.os }}-
      - name: Build
        run: pnpm turbo run build --filter=@immersia/web
      - name: Run Playwright
        working-directory: apps/web
        run: pnpm e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
